# Loaded by DcentbActuatorAutoConfiguration at low priority - a consumer's own application.properties
# always wins over anything here. See docs/health-readiness-metrics.md "Security defaults".

# Enables Boot's built-in liveness/readiness probe groups (off by default outside Kubernetes).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo
management.endpoint.health.group.liveness.include=livenessState

# Deliberately NOT set here, left at Spring Boot's own safe defaults:
#   management.endpoints.web.exposure.include (default: health only)
#   management.endpoint.health.show-details   (default: never)
# dcentb never ships an override that widens either of these.
