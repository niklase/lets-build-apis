dcentb.openapi.file=classpath:students-demo.openapi.json
dcentb.mongodb.connection=mongodb://admin:adminpassword@localhost:27017/?authSource=admin
dcentb.mongodb.db=students-demo

# Demo-only: widens Actuator exposure beyond dcentb's own safe defaults (health only, no details)
# so you can browse /actuator/health with full detail and /actuator/metrics in a browser. Do NOT
# do this in a real deployment - see dcentb/docs/health-readiness-metrics.md "Security defaults".
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
